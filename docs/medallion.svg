<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFA"/>
      <stop offset="100%" stop-color="#EFEDFB"/>
    </linearGradient>
    <filter id="medShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9AA3AF"/>
    </marker>
    <style>
      .layer-label { font-size: 16px; font-weight: 800; fill: #1F2937; }
      .layer-sub { font-size: 12px; fill: #4B5563; }
    </style>
  </defs>
  <rect width="900" height="220" rx="20" fill="url(#medBg)"/>

  <!-- Bronze -->
  <g opacity="0" filter="url(#medShadow)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.2;1" dur="4s" repeatCount="indefinite"/>
    <rect x="40" y="60" width="230" height="110" rx="16" fill="#ffffff" stroke="#E7C9A8" stroke-width="2"/>
    <rect x="40" y="60" width="230" height="6" rx="3" fill="#B87F4A"/>
    <text class="layer-label" x="155" y="108" text-anchor="middle">BRONZE</text>
    <text class="layer-sub" x="155" y="131" text-anchor="middle">Raw Landing Zone</text>
    <text class="layer-sub" x="155" y="149" text-anchor="middle">Data Quality Checks</text>
  </g>

  <!-- arrow 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.32;1" dur="4s" repeatCount="indefinite"/>
    <path d="M280,115 L330,115" stroke="#9AA3AF" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Silver -->
  <g opacity="0" filter="url(#medShadow)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.5;1" dur="4s" repeatCount="indefinite"/>
    <rect x="335" y="60" width="230" height="110" rx="16" fill="#ffffff" stroke="#D9D4FB" stroke-width="2"/>
    <rect x="335" y="60" width="230" height="6" rx="3" fill="#7C6FF0"/>
    <text class="layer-label" x="450" y="101" text-anchor="middle">SILVER</text>
    <text class="layer-sub" x="450" y="124" text-anchor="middle">One Big Table (OBT)</text>
    <text class="layer-sub" x="450" y="142" text-anchor="middle">Metadata-Driven Transforms</text>
    <text class="layer-sub" x="450" y="160" text-anchor="middle">Audit &amp; Logging</text>
  </g>

  <!-- arrow 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.62;1" dur="4s" repeatCount="indefinite"/>
    <path d="M575,115 L625,115" stroke="#9AA3AF" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Gold -->
  <g opacity="0" filter="url(#medShadow)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.8;1" dur="4s" repeatCount="indefinite"/>
    <rect x="630" y="60" width="230" height="110" rx="16" fill="#ffffff" stroke="#FBE3A6" stroke-width="2"/>
    <rect x="630" y="60" width="230" height="6" rx="3" fill="#F5A623"/>
    <text class="layer-label" x="745" y="101" text-anchor="middle">GOLD</text>
    <text class="layer-sub" x="745" y="124" text-anchor="middle">Star Schema · SCD Type 2</text>
    <text class="layer-sub" x="745" y="142" text-anchor="middle">Row-Level Security</text>
    <text class="layer-sub" x="745" y="160" text-anchor="middle">Power BI Ready</text>
  </g>

  <text x="450" y="205" text-anchor="middle" font-size="12" fill="#6B7280">Medallion Architecture — Bronze → Silver → Gold</text>
</svg>
