<svg viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .node-short { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .node-title { font-size: 17px; font-weight: 800; fill: #ffffff; }
      .node-sub   { font-size: 11.5px; fill: #9aa4b2; }
      .stage-num  { font-size: 12px; fill: #8b949e; }
      .glow { animation: glowPulse 2.6s ease-in-out infinite; transform-origin: center; }
      @keyframes glowPulse {
        0%   { filter: drop-shadow(0 0 0px currentColor); }
        50%  { filter: drop-shadow(0 0 12px currentColor); }
        100% { filter: drop-shadow(0 0 0px currentColor); }
      }
    </style>
  </defs>

  <rect width="1500" height="520" fill="#0d1117"/>
  <text x="750" y="24" text-anchor="middle" font-size="14" fill="#8b949e" letter-spacing="1px">DATA FLOW — INGEST TO INSIGHT</text>

  <!-- Flow curve -->
  <path id="flowpath" d="M150,185 C300,185 300,345 450,345 C600,345 600,185 750,185 C900,185 900,345 1050,345 C1200,345 1200,185 1350,185"
        fill="none" stroke="#22283a" stroke-width="3"/>

  <!-- Flowing particles -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="7s" repeatCount="indefinite" path="M150,185 C300,185 300,345 450,345 C600,345 600,185 750,185 C900,185 900,345 1050,345 C1200,345 1200,185 1350,185"/>
  </circle>
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="7s" begin="1.75s" repeatCount="indefinite" path="M150,185 C300,185 300,345 450,345 C600,345 600,185 750,185 C900,185 900,345 1050,345 C1200,345 1200,185 1350,185"/>
  </circle>
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M150,185 C300,185 300,345 450,345 C600,345 600,185 750,185 C900,185 900,345 1050,345 C1200,345 1200,185 1350,185"/>
  </circle>
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="7s" begin="5.25s" repeatCount="indefinite" path="M150,185 C300,185 300,345 450,345 C600,345 600,185 750,185 C900,185 900,345 1050,345 C1200,345 1200,185 1350,185"/>
  </circle>

  <!-- Node 1: AWS S3 -->
  <g class="glow" style="color:#FF9900;">
    <circle cx="150" cy="185" r="50" fill="#FF9900" stroke="#0d1117" stroke-width="4"/>
    <text class="node-short" x="150" y="191" text-anchor="middle">S3</text>
  </g>
  <text class="node-title" x="150" y="120" text-anchor="middle">AWS S3</text>
  <text class="node-sub" x="150" y="102" text-anchor="middle">Raw CSVs / Staging</text>

  <!-- Node 2: Snowflake Bronze -->
  <g class="glow" style="color:#29B5E8;">
    <circle cx="450" cy="345" r="50" fill="#29B5E8" stroke="#0d1117" stroke-width="4"/>
    <text class="node-short" x="450" y="351" text-anchor="middle">❄</text>
  </g>
  <text class="node-title" x="450" y="420" text-anchor="middle">Snowflake</text>
  <text class="node-sub" x="450" y="438" text-anchor="middle">Bronze Layer</text>
  <text class="node-sub" x="450" y="454" text-anchor="middle">Data Quality Checks</text>

  <!-- Node 3: dbt -->
  <g class="glow" style="color:#FF694B;">
    <circle cx="750" cy="185" r="50" fill="#FF694B" stroke="#0d1117" stroke-width="4"/>
    <text class="node-short" x="750" y="191" text-anchor="middle">dbt</text>
  </g>
  <text class="node-title" x="750" y="120" text-anchor="middle">dbt Transform</text>
  <text class="node-sub" x="750" y="102" text-anchor="middle">OBT · YAML-Driven</text>
  <text class="node-sub" x="750" y="84" text-anchor="middle">Audit &amp; Metadata-Driven</text>

  <!-- Node 4: Star Schema -->
  <g class="glow" style="color:#D9B300;">
    <circle cx="1050" cy="345" r="50" fill="#D9B300" stroke="#0d1117" stroke-width="4"/>
    <text class="node-short" x="1050" y="351" text-anchor="middle" fill="#252423">★</text>
  </g>
  <text class="node-title" x="1050" y="420" text-anchor="middle">Star Schema</text>
  <text class="node-sub" x="1050" y="438" text-anchor="middle">Fact + Dim Tables · SCD Type 2</text>
  <text class="node-sub" x="1050" y="454" text-anchor="middle">Row-Level Security</text>

  <!-- Node 5: Power BI -->
  <g class="glow" style="color:#F2C811;">
    <circle cx="1350" cy="185" r="50" fill="#F2C811" stroke="#0d1117" stroke-width="4"/>
    <text class="node-short" x="1350" y="191" text-anchor="middle" fill="#252423">PBI</text>
  </g>
  <text class="node-title" x="1350" y="120" text-anchor="middle">Power BI</text>
  <text class="node-sub" x="1350" y="102" text-anchor="middle">Executive Dashboards</text>
  <text class="node-sub" x="1350" y="84" text-anchor="middle">Drill-Down Analysis</text>

  <!-- Stage numbers -->
  <text class="stage-num" x="150" y="495" text-anchor="middle">1 · Ingest</text>
  <text class="stage-num" x="450" y="495" text-anchor="middle">2 · Land &amp; Validate</text>
  <text class="stage-num" x="750" y="495" text-anchor="middle">3 · Transform</text>
  <text class="stage-num" x="1050" y="495" text-anchor="middle">4 · Model &amp; Secure</text>
  <text class="stage-num" x="1350" y="495" text-anchor="middle">5 · Visualize</text>
</svg>
