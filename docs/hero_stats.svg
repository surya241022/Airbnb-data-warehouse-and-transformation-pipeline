<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFA"/>
      <stop offset="100%" stop-color="#EFEDFB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5A5"/>
      <stop offset="100%" stop-color="#7C6FF0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C6FF0" flood-opacity="0.12"/>
    </filter>
    <style>
      .tile-label { font-size: 13px; fill: #6B7280; letter-spacing: 0.6px; font-weight: 600; }
      .tile-value { font-size: 30px; font-weight: 800; fill: #1F2937; }
      .float { animation: floatY 4s ease-in-out infinite; }
      @keyframes floatY {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }
      .bar { animation: growBar 2.2s ease-out forwards; }
      @keyframes growBar {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)" stroke="#E3E8F0"/>

  <!-- Title -->
  <text x="40" y="55" font-size="24" font-weight="800" fill="#1F2937">Airbnb Performance — At a Glance</text>
  <text x="40" y="80" font-size="13" fill="#6B7280">Live metrics from the Gold-layer Star Schema, surfaced in Power BI</text>

  <!-- Stat tiles -->
  <g class="float" filter="url(#softShadow)">
    <rect x="40" y="105" width="255" height="110" rx="18" fill="#ffffff" stroke="#E3E8F0"/>
    <rect x="40" y="105" width="8" height="110" rx="4" fill="#0EA5A5"/>
    <text class="tile-label" x="60" y="135">TOTAL REVENUE</text>
    <text class="tile-value" x="60" y="180">62.53M</text>
    <rect x="60" y="195" width="215" height="6" rx="3" fill="#EEF2F6"/>
    <rect x="60" y="195" width="215" height="6" rx="3" fill="#0EA5A5" class="bar" style="transform-origin: 60px 198px;"/>
  </g>

  <g class="float" filter="url(#softShadow)" style="animation-delay: 0.3s;">
    <rect x="315" y="105" width="255" height="110" rx="18" fill="#ffffff" stroke="#E3E8F0"/>
    <rect x="315" y="105" width="8" height="110" rx="4" fill="#F5A623"/>
    <text class="tile-label" x="335" y="135">TOTAL BOOKINGS</text>
    <text class="tile-value" x="335" y="180">5K</text>
    <rect x="335" y="195" width="215" height="6" rx="3" fill="#EEF2F6"/>
    <rect x="335" y="195" width="150" height="6" rx="3" fill="#F5A623" class="bar" style="transform-origin: 335px 198px;"/>
  </g>

  <g class="float" filter="url(#softShadow)" style="animation-delay: 0.6s;">
    <rect x="590" y="105" width="255" height="110" rx="18" fill="#ffffff" stroke="#E3E8F0"/>
    <rect x="590" y="105" width="8" height="110" rx="4" fill="#7C6FF0"/>
    <text class="tile-label" x="610" y="135">TOTAL LISTINGS</text>
    <text class="tile-value" x="610" y="180">500</text>
    <rect x="610" y="195" width="215" height="6" rx="3" fill="#EEF2F6"/>
    <rect x="610" y="195" width="120" height="6" rx="3" fill="#7C6FF0" class="bar" style="transform-origin: 610px 198px;"/>
  </g>

  <g class="float" filter="url(#softShadow)" style="animation-delay: 0.9s;">
    <rect x="865" y="105" width="255" height="110" rx="18" fill="#ffffff" stroke="#E3E8F0"/>
    <rect x="865" y="105" width="8" height="110" rx="4" fill="#FF6F59"/>
    <text class="tile-label" x="885" y="135">TOTAL HOSTS</text>
    <text class="tile-value" x="885" y="180">189</text>
    <rect x="885" y="195" width="215" height="6" rx="3" fill="#EEF2F6"/>
    <rect x="885" y="195" width="90" height="6" rx="3" fill="#FF6F59" class="bar" style="transform-origin: 885px 198px;"/>
  </g>

  <!-- Revenue by property type mini bars -->
  <text x="40" y="255" font-size="13" fill="#6B7280" letter-spacing="0.6px" font-weight="600">REVENUE BY PROPERTY TYPE</text>

  <text x="40" y="285" font-size="12" fill="#374151">House</text>
  <rect x="120" y="273" width="1040" height="14" rx="7" fill="#EEF2F6"/>
  <rect x="120" y="273" width="360" height="14" rx="7" fill="url(#accentGrad)" class="bar" style="transform-origin: 120px 280px;"/>
  <text x="1090" y="285" font-size="12" fill="#374151" text-anchor="end">21.5M</text>

  <text x="40" y="315" font-size="12" fill="#374151">Condo</text>
  <rect x="120" y="303" width="1040" height="14" rx="7" fill="#EEF2F6"/>
  <rect x="120" y="303" width="353" height="14" rx="7" fill="url(#accentGrad)" class="bar" style="transform-origin: 120px 310px;"/>
  <text x="1090" y="315" font-size="12" fill="#374151" text-anchor="end">21.1M</text>

  <text x="40" y="345" font-size="12" fill="#374151">Apartment</text>
  <rect x="120" y="333" width="1040" height="14" rx="7" fill="#EEF2F6"/>
  <rect x="120" y="333" width="332" height="14" rx="7" fill="url(#accentGrad)" class="bar" style="transform-origin: 120px 340px;"/>
  <text x="1090" y="345" font-size="12" fill="#374151" text-anchor="end">19.9M</text>
</svg>
