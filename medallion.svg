<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .layer-label { font-size: 18px; font-weight: 800; }
      .layer-sub { font-size: 12px; opacity: 0.92; }
    </style>
    <marker id="chev" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto">
      <path d="M2,2 L9,7 L2,12" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="700" height="520" fill="#0d1117"/>
  <text x="350" y="40" text-anchor="middle" font-size="14" fill="#8b949e" letter-spacing="1px">MEDALLION ARCHITECTURE</text>

  <!-- Bronze: widest -->
  <g>
    <polygon points="60,70 640,70 570,180 130,180" fill="#CD7F32"/>
    <text class="layer-label" x="350" y="115" text-anchor="middle" fill="#ffffff">BRONZE</text>
    <text class="layer-sub" x="350" y="140" text-anchor="middle" fill="#ffffff">Raw Landing Zone from S3</text>
    <text class="layer-sub" x="350" y="158" text-anchor="middle" fill="#ffffff">Automated Data Quality Checks</text>
  </g>

  <path d="M350,182 L350,208" stroke="#8b949e" stroke-width="3" marker-end="url(#chev)"/>

  <!-- Silver: mid -->
  <g>
    <polygon points="130,210 570,210 480,320 220,320" fill="#C0C0C0"/>
    <text class="layer-label" x="350" y="255" text-anchor="middle" fill="#252423">SILVER</text>
    <text class="layer-sub" x="350" y="278" text-anchor="middle" fill="#252423">One Big Table (OBT)</text>
    <text class="layer-sub" x="350" y="296" text-anchor="middle" fill="#252423">Metadata-Driven · YAML-Configured · Audit &amp; Logging</text>
  </g>

  <path d="M350,322 L350,348" stroke="#8b949e" stroke-width="3" marker-end="url(#chev)"/>

  <!-- Gold: narrowest -->
  <g>
    <polygon points="220,350 480,350 420,460 280,460" fill="#D9B300"/>
    <text class="layer-label" x="350" y="395" text-anchor="middle" fill="#252423">GOLD</text>
    <text class="layer-sub" x="350" y="418" text-anchor="middle" fill="#252423">Star Schema · SCD Type 2</text>
    <text class="layer-sub" x="350" y="436" text-anchor="middle" fill="#252423">Row-Level Security · Power BI Ready</text>
  </g>

  <text x="350" y="500" text-anchor="middle" font-size="12" fill="#8b949e">Each layer refines and narrows the data — Bronze → Silver → Gold</text>
</svg>
