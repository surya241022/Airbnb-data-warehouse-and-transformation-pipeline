<svg viewBox="0 0 1500 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFA"/>
      <stop offset="100%" stop-color="#EFEDFB"/>
    </linearGradient>
    <filter id="pfShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .stage-label { font-size: 19px; font-weight: 800; fill: #1F2937; }
      .stage-sub { font-size: 11.5px; fill: #4B5563; }
      .breathe { animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.015); }
        100% { transform: scale(1); }
      }
    </style>
  </defs>

  <rect width="1500" height="320" rx="20" fill="url(#pfBg)"/>

  <!-- S3 -->
  <g class="breathe" filter="url(#pfShadow)" style="transform-origin: 110px 160px;">
    <rect x="20" y="110" width="180" height="100" rx="18" fill="#ffffff" stroke="#B7EDEA" stroke-width="2"/>
    <rect x="20" y="110" width="180" height="6" rx="3" fill="#0EA5A5"/>
    <text class="stage-label" x="110" y="152" text-anchor="middle">AWS S3</text>
    <text class="stage-sub" x="110" y="174" text-anchor="middle">Raw CSVs / Staging</text>
  </g>

  <!-- Snowflake Bronze -->
  <g class="breathe" filter="url(#pfShadow)" style="transform-origin: 370px 160px; animation-delay: 0.2s;">
    <rect x="270" y="110" width="200" height="100" rx="18" fill="#ffffff" stroke="#FFE1B8" stroke-width="2"/>
    <rect x="270" y="110" width="200" height="6" rx="3" fill="#F5A623"/>
    <text class="stage-label" x="370" y="147" text-anchor="middle">Snowflake</text>
    <text class="stage-sub" x="370" y="169" text-anchor="middle">Bronze Layer</text>
    <text class="stage-sub" x="370" y="186" text-anchor="middle">Data Quality Checks</text>
  </g>

  <!-- dbt OBT + Metadata -->
  <g class="breathe" filter="url(#pfShadow)" style="transform-origin: 655px 160px; animation-delay: 0.4s;">
    <rect x="540" y="90" width="230" height="140" rx="18" fill="#ffffff" stroke="#D9D4FB" stroke-width="2"/>
    <rect x="540" y="90" width="230" height="6" rx="3" fill="#7C6FF0"/>
    <text class="stage-label" x="655" y="122" text-anchor="middle">dbt</text>
    <text class="stage-sub" x="655" y="145" text-anchor="middle">One Big Table (OBT)</text>
    <text class="stage-sub" x="655" y="163" text-anchor="middle">YAML-Driven Pipeline</text>
    <text class="stage-sub" x="655" y="181" text-anchor="middle">Audit &amp; Logging</text>
    <text class="stage-sub" x="655" y="199" text-anchor="middle">Metadata-Driven</text>
  </g>

  <!-- Star Schema + Security -->
  <g class="breathe" filter="url(#pfShadow)" style="transform-origin: 955px 160px; animation-delay: 0.6s;">
    <rect x="840" y="90" width="230" height="140" rx="18" fill="#ffffff" stroke="#FFD3CB" stroke-width="2"/>
    <rect x="840" y="90" width="230" height="6" rx="3" fill="#FF6F59"/>
    <text class="stage-label" x="955" y="125" text-anchor="middle">Star Schema</text>
    <text class="stage-sub" x="955" y="148" text-anchor="middle">Fact + Dimension Tables</text>
    <text class="stage-sub" x="955" y="166" text-anchor="middle">SCD Type 2</text>
    <text class="stage-sub" x="955" y="184" text-anchor="middle">Row-Level Security</text>
    <text class="stage-sub" x="955" y="202" text-anchor="middle">GitHub + Snowflake</text>
  </g>

  <!-- Power BI -->
  <g class="breathe" filter="url(#pfShadow)" style="transform-origin: 1250px 160px; animation-delay: 0.8s;">
    <rect x="1140" y="110" width="220" height="100" rx="18" fill="#ffffff" stroke="#B7EDEA" stroke-width="2"/>
    <rect x="1140" y="110" width="220" height="6" rx="3" fill="#0EA5A5"/>
    <text class="stage-label" x="1250" y="150" text-anchor="middle">Power BI</text>
    <text class="stage-sub" x="1250" y="172" text-anchor="middle">Executive Dashboards</text>
    <text class="stage-sub" x="1250" y="189" text-anchor="middle">Drill-Down Analysis</text>
  </g>

  <!-- Connector paths -->
  <path id="path1" d="M200,160 L270,160" stroke="#C7CDD6" stroke-width="2" fill="none"/>
  <path id="path2" d="M470,160 L540,160" stroke="#C7CDD6" stroke-width="2" fill="none"/>
  <path id="path3" d="M770,160 L840,160" stroke="#C7CDD6" stroke-width="2" fill="none"/>
  <path id="path4" d="M1070,160 L1140,160" stroke="#C7CDD6" stroke-width="2" fill="none"/>

  <!-- Flowing data particles -->
  <circle r="6" fill="#7C6FF0">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M200,160 L270,160"/>
  </circle>
  <circle r="6" fill="#7C6FF0">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M470,160 L540,160"/>
  </circle>
  <circle r="6" fill="#7C6FF0">
    <animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M770,160 L840,160"/>
  </circle>
  <circle r="6" fill="#7C6FF0">
    <animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M1070,160 L1140,160"/>
  </circle>

  <!-- Bottom labels -->
  <text x="110" y="255" text-anchor="middle" font-size="12" fill="#6B7280">1 · Ingest</text>
  <text x="370" y="255" text-anchor="middle" font-size="12" fill="#6B7280">2 · Land &amp; Validate</text>
  <text x="655" y="255" text-anchor="middle" font-size="12" fill="#6B7280">3 · Transform</text>
  <text x="955" y="255" text-anchor="middle" font-size="12" fill="#6B7280">4 · Model &amp; Secure</text>
  <text x="1250" y="255" text-anchor="middle" font-size="12" fill="#6B7280">5 · Visualize</text>
</svg>
